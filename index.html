<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Admisión - Instituto Tecnológico</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }
        .form-container {
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 700px;
            padding: 30px;
            width: 100%;
        }
        h2 {
            color: #1a365d;
            margin-bottom: 8px;
            text-align: center;
        }
        p.subtitle {
            color: #4a5568;
            font-size: 14px;
            margin-bottom: 25px;
            text-align: center;
        }
        fieldset {
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            margin-bottom: 20px;
            padding: 20px;
        }
        legend {
            color: #2b6cb0;
            font-weight: bold;
            padding: 0 8px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-row {
            display: flex;
            gap: 15px;
        }
        .form-row .form-group {
            flex: 1;
        }
        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 5px;
        }
        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="date"],
        select {
            border: 1px solid #cbd5e0;
            border-radius: 4px;
            font-size: 14px;
            padding: 10px;
            width: 100%;
        }
        input:focus, select:focus {
            border-color: #3182ce;
            outline: none;
        }
        .radio-group, .checkbox-group {
            display: flex;
            gap: 15px;
            margin-top: 5px;
        }
        .radio-group label, .checkbox-group label {
            font-weight: normal;
        }
        .file-input {
            border: 1px dashed #cbd5e0;
            background: #f7fafc;
            padding: 10px;
            text-align: center;
        }
        .btn-submit {
            background-color: #2b6cb0;
            border: none;
            border-radius: 4px;
            color: white;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            padding: 12px;
            transition: background 0.3s;
            width: 100%;
        }
        .btn-submit:hover {
            background-color: #2c5282;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Solicitud de Admisión Digital</h2>
    <p class="subtitle">Instituto de Tecnología | Admisiones 2026</p>

    <form action="#" method="POST" enctype="multipart/form-data">
        
        <!-- 1. Datos Personales -->
        <fieldset>
            <legend>1. Datos Personales</legend>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="nombres">Nombres completas *</label>
                    <input type="text" id="nombres" name="nombres" required>
                </div>
                <div class="form-group">
                    <label for="apellidos">Apellidos completos *</label>
                    <input type="text" id="apellidos" name="apellidos" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="tipo_doc">Tipo de Documento *</label>
                    <select id="tipo_doc" name="tipo_doc" required>
                        <option value="">Seleccione...</option>
                        <option value="DNI">DNI</option>
                        <option value="Pasaporte">Pasaporte</option>
                        <option value="CE">Carné de Extranjería</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="num_doc">Número de Documento *</label>
                    <input type="text" id="num_doc" name="num_doc" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="email">Correo Electrónico *</label>
                    <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
                </div>
                <div class="form-group">
                    <label for="telefono">Teléfono / WhatsApp *</label>
                    <input type="tel" id="telefono" name="telefono" placeholder="+51 987654321" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="fec_nac">Fecha de Nacimiento *</label>
                    <input type="date" id="fec_nac" name="fec_nac" required>
                </div>
                <div class="form-group">
                    <label for="direccion">Dirección de Residencia</label>
                    <input type="text" id="direccion" name="direccion">
                </div>
            </div>
        </fieldset>

        <!-- 2. Programa de Interés -->
        <fieldset>
            <legend>2. Programa Académico de Interés</legend>
            
            <div class="form-group">
                <label for="carrera">Carrera / Especialidad IT *</label>
                <select id="carrera" name="carrera" required>
                    <option value="">Seleccione una especialidad...</option>
                    <option value="software">Desarrollo de Software / Full Stack</option>
                    <option value="ciberseguridad">Ciberseguridad y Hacking Ético</option>
                    <option value="data">Ciencia de Datos e Inteligencia Artificial</option>
                    <option value="cloud">Administración de Redes y Cloud Computing</option>
                </select>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Modalidad *</label>
                    <div class="radio-group">
                        <label><input type="radio" name="modalidad" value="presencial" required> Presencial</label>
                        <label><input type="radio" name="modalidad" value="virtual"> Virtual</label>
                        <label><input type="radio" name="modalidad" value="hibrida"> Híbrida</label>
                    </div>
                </div>
                <div class="form-group">
                    <label>Turno *</label>
                    <div class="radio-group">
                        <label><input type="radio" name="turno" value="manana" required> Mañana</label>
                        <label><input type="radio" name="turno" value="tarde"> Tarde</label>
                        <label><input type="radio" name="turno" value="noche"> Noche</label>
                    </div>
                </div>
            </div>
        </fieldset>

        <!-- 3. Perfil Académico y Técnico -->
        <fieldset>
            <legend>3. Perfil del Postulante</legend>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="nivel_estudios">Nivel de Estudios *</label>
                    <select id="nivel_estudios" name="nivel_estudios" required>
                        <option value="">Seleccione...</option>
                        <option value="secundaria">Secundaria Completa</option>
                        <option value="tecnico">Educación Técnica</option>
                        <option value="universitario">Educación Universitaria</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="ingles">Nivel de Inglés *</label>
                    <select id="ingles" name="ingles" required>
                        <option value="basico">Básico</option>
                        <option value="intermedio">Intermedio</option>
                        <option value="avanzado">Avanzado</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="exp_programacion">Experiencia previa en Programación / IT *</label>
                <select id="exp_programacion" name="exp_programacion" required>
                    <option value="ninguna">Ninguna (Principiante)</option>
                    <option value="basica">Básica (Cursos cortos / Autodidacta)</option>
                    <option value="intermedia">Intermedia / Avanzada</option>
                </select>
            </div>
        </fieldset>

        <!-- 4. Documentación -->
        <fieldset>
            <legend>4. Requisitos Adjuntos</legend>
            
            <div class="form-group">
                <label for="doc_identidad_file">Documento de Identidad (Ambos lados - PDF/JPG) *</label>
                <input type="file" id="doc_identidad_file" name="doc_identidad_file" class="file-input" accept=".pdf,.jpg,.jpeg,.png" required>
            </div>

            <div class="form-group">
                <label for="certificado_file">Certificado de Estudios de Secundaria (PDF) *</label>
                <input type="file" id="certificado_file" name="certificado_file" class="file-input" accept=".pdf" required>
            </div>
        </fieldset>

        <!-- 5. Confirmación y Envío -->
        <fieldset>
            <legend>5. Términos y Condiciones</legend>
            
            <div class="form-group checkbox-group">
                <input type="checkbox" id="terminos" name="terminos" required>
                <label for="terminos">Acepto los términos de tratamiento de datos personales y declaro que la información brindada es verídica. *</label>
            </div>
        </fieldset>

        <button type="submit" class="btn-submit">ENVIAR SOLICITUD DE ADMISIÓN</button>

    </form>
</div>

</body>
</html>
